services:
  app:
    build: .
    container_name: redis-user-cache-app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - postgres
      - redis
    env_file:
      - .env

  worker:
    build: .
    container_name: notification-worker
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - redis
    env_file:
      - .env
    command: node src/workers/notification.worker.js

  postgres:
    image: postgres:17-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mohit13
      POSTGRES_DB: redis_user_cache
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: redis-db
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
